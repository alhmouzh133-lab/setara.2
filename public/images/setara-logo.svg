<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 800" width="800" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .cls-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
      }
      .cls-store {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: 2px;
      }
    </style>
  </defs>

  <!-- Circular Badge with crisp black border and clean white background -->
  <circle cx="400" cy="400" r="388" fill="#FFFFFF" stroke="#1A1817" stroke-width="16" />

  <!-- TOP GRAPHIC: Window with Curtains -->
  <g id="curtain-window" stroke="#1A1817" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Window Frame -->
    <rect x="306" y="215" width="188" height="185" stroke-width="3.5" />
    <!-- Window Cross Mullions -->
    <line x1="306" y1="332" x2="494" y2="332" stroke-width="3" />
    <line x1="400" y1="215" x2="400" y2="400" stroke-width="3" />

    <!-- Curtain Rod -->
    <line x1="288" y1="216" x2="512" y2="216" stroke-width="6" />
    <!-- Rod Finials / End Brackets -->
    <line x1="288" y1="210" x2="288" y2="222" stroke-width="6" />
    <line x1="512" y1="210" x2="512" y2="222" stroke-width="6" />
    <circle cx="288" cy="216" r="4.5" fill="#1A1817" />
    <circle cx="512" cy="216" r="4.5" fill="#1A1817" />

    <!-- Valance / Swag (Center draped fabric) -->
    <!-- Front drape shape -->
    <path d="M 308,216 Q 400,268 492,216 C 478,252 435,274 400,274 C 365,274 322,252 308,216 Z" fill="#FFFFFF" stroke-width="3.5" />
    <!-- Internal swag pleats -->
    <path d="M 324,222 Q 400,264 476,222" stroke-width="2.5" />
    <path d="M 346,230 Q 400,261 454,230" stroke-width="2.2" />

    <!-- LEFT CURTAIN PANEL -->
    <!-- Outer silhouette & folds -->
    <path d="M 308,216 C 302,260 306,305 328,340 C 314,354 300,380 308,416 C 318,418 334,402 344,410 C 352,400 348,375 342,348 C 348,320 342,270 338,216" 
          fill="#FFFFFF" stroke-width="3.5" />
    <!-- Left panel inner fold lines -->
    <path d="M 320,224 C 318,265 324,310 334,342" stroke-width="2.2" />
    <path d="M 328,220 C 330,260 336,300 340,332" stroke-width="2" />
    <!-- Left tieback gather crease -->
    <path d="M 324,340 C 332,344 340,344 346,338" stroke-width="3.5" />
    <!-- Left lower tail crease -->
    <path d="M 314,358 C 322,374 328,392 328,412" stroke-width="2" />

    <!-- RIGHT CURTAIN PANEL -->
    <!-- Outer silhouette & folds -->
    <path d="M 492,216 C 498,260 494,305 472,340 C 486,354 500,380 492,416 C 482,418 466,402 456,410 C 448,400 452,375 458,348 C 452,320 458,270 462,216" 
          fill="#FFFFFF" stroke-width="3.5" />
    <!-- Right panel inner fold lines -->
    <path d="M 480,224 C 482,265 476,310 466,342" stroke-width="2.2" />
    <path d="M 472,220 C 470,260 464,300 460,332" stroke-width="2" />
    <!-- Right tieback gather crease -->
    <path d="M 476,340 C 468,344 460,344 454,338" stroke-width="3.5" />
    <!-- Right lower tail crease -->
    <path d="M 486,358 C 478,374 472,392 472,412" stroke-width="2" />
  </g>

  <!-- TYPOGRAPHY: SETARA -->
  <!-- 'S' -->
  <text x="145" y="530" class="cls-text" font-size="114" fill="#1A1817">S</text>
  <!-- 'E' -->
  <text x="228" y="530" class="cls-text" font-size="114" fill="#1A1817">E</text>
  <!-- 'T' -->
  <text x="310" y="530" class="cls-text" font-size="114" fill="#1A1817">T</text>
  <!-- 'A' -->
  <text x="390" y="530" class="cls-text" font-size="114" fill="#1A1817">A</text>

  <!-- Red Rounded Square for 'R' -->
  <rect x="473" y="435" width="94" height="106" rx="22" ry="22" fill="#E51E2B" />
  <!-- 'R' (Solid black inside red rounded square) -->
  <text x="487" y="530" class="cls-text" font-size="114" fill="#1A1817">R</text>

  <!-- Second 'A' -->
  <text x="572" y="530" class="cls-text" font-size="114" fill="#1A1817">A</text>

  <!-- Red Outlined Heart at top-right of 'A' -->
  <g transform="translate(638, 428) rotate(16) scale(0.68)">
    <path d="M 0,16 A 12,12 0 0,1 24,16 Q 24,28 0,46 Q -24,28 -24,16 A 12,12 0 0,1 0,16 Z" 
          fill="none" stroke="#E51E2B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- SUBTITLE: STORE -->
  <text x="500" y="584" class="cls-store" font-size="44" fill="#1A1817">STORE</text>
</svg>